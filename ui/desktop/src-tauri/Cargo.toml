[package]
name = "goose-app"
edition.workspace = true
version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description.workspace = true

[lints]
workspace = true

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "goose_app"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tokio = { version = "1.45.1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
axum = { version = "0.8.1", features = ["macros", "tokio", "http1", "ws"] }
tower-service = "0.3.3"
tower-http = { version = "0.5", features = ["cors"] }
tauri-axum-htmx = { git = "https://github.com/sternelee/tauri-axum" }
goose-server = { path = "../../../crates/goose-server" }
goose = { path = "../../../crates/goose" }
mcp-core = { path = "../../../crates/mcp-core" }
# goose-mcp = { path = "../../../crates/goose-mcp" }
rmcp = { workspace = true }
futures = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = [
  "env-filter",
  "fmt",
  "json",
  "time",
] }
anyhow = "1.0"
bytes = "1.5"
http = "1.0"
base64 = "0.21"
thiserror = "1.0"
etcetera = "0.8.0"
serde_yaml = "0.9.34"
utoipa = { version = "4.1", features = ["axum_extras", "chrono"] }
reqwest = { version = "0.12.9", features = [
  "json",
  "rustls-tls",
  "blocking",
  "multipart",
], default-features = false }
tokio-util = "0.7.15"
uuid = { version = "1.11", features = ["v4"] }
chrono = "0.4"
config = { version = "0.14.1", features = ["toml"] }

[dependencies.tauri]
version = "2.8.5"
default-features = false
features = ["wry"]
